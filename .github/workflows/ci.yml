name: BE CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    # Dùng Environment "MONGODB_URI" (đã tạo trong repo settings) để có secrets
    # MONGODB_URI + DATABASE_NAME cho integration tests
    environment: MONGODB_URI
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # npm test chạy cả unit (21) + integration (22); integration tự SKIP
      # khi không có MONGODB_URI - thêm secrets MONGODB_URI + DATABASE_NAME
      # trong repo settings để bật đầy đủ
      - name: Tests (unit + integration; integration needs DB secrets)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          ACCESS_TOKEN_SECRET_SIGNATURE: ci-test-access-secret
          REFRESH_TOKEN_SECRET_SIGNATURE: ci-test-refresh-secret
          ACCESS_TOKEN_LIFE: 15m
          REFRESH_TOKEN_LIFE: 7d
          AUTHOR: ci
          BUILD_MODE: dev
          WEBSITE_DOMAIN_DEVELOPMENT: http://localhost:5173
          WEBSITE_DOMAIN_PRODUCTION: http://localhost:5173
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Upload test output (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          retention-days: 7

      # Chẩn đoán vô điều kiện: kiểm tra file log + bắn các dòng cuối ra ANNOTATIONS
      - name: Surface diagnostics as annotations
        if: always()
        run: |
          echo "::error::DIAG pwd=$(pwd)"
          ls -la test-output.log || echo "::error::DIAG NO LOG FILE"
          wc -l test-output.log || echo "::error::DIAG WC FAILED"
          grep -nE "FAILED|not ok [0-9]+ - " test-output.log | head -10 | while IFS= read -r line; do
            echo "::error::DIAG $line"
          done
