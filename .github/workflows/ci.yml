name: BE CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Unit tests (không cần DB). Integration tests (npm run test:e2e) cần
      # MONGODB_URI - bật secrets MONGODB_URI trong repo settings nếu muốn chạy:
      - name: Unit tests
        run: npm test

      - name: Integration tests (optional, needs MONGODB_URI secret)
        if: ${{ secrets.MONGODB_URI != '' }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          ACCESS_TOKEN_SECRET_SIGNATURE: ci-test-access-secret
          REFRESH_TOKEN_SECRET_SIGNATURE: ci-test-refresh-secret
          ACCESS_TOKEN_LIFE: 15m
          REFRESH_TOKEN_LIFE: 7d
          AUTHOR: ci
          BUILD_MODE: dev
          WEBSITE_DOMAIN_DEVELOPMENT: http://localhost:5173
          WEBSITE_DOMAIN_PRODUCTION: http://localhost:5173
        run: npm run test:e2e
