name: BE CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    # Dùng Environment "MONGODB_URI" (đã tạo trong repo settings) để có secrets
    # MONGODB_URI + DATABASE_NAME cho integration tests
    environment: MONGODB_URI
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # npm test chạy cả unit (21) + integration (22); integration tự SKIP
      # khi không có MONGODB_URI - thêm secrets MONGODB_URI + DATABASE_NAME
      # trong repo settings để bật đầy đủ
      - name: Tests (unit + integration; integration needs DB secrets)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          ACCESS_TOKEN_SECRET_SIGNATURE: ci-test-access-secret
          REFRESH_TOKEN_SECRET_SIGNATURE: ci-test-refresh-secret
          ACCESS_TOKEN_LIFE: 15m
          REFRESH_TOKEN_LIFE: 7d
          AUTHOR: ci
          BUILD_MODE: dev
          WEBSITE_DOMAIN_DEVELOPMENT: http://localhost:5173
          WEBSITE_DOMAIN_PRODUCTION: http://localhost:5173
        run: npm test
